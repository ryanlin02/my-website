name: 每週一 05:00 油價自動更新

on:
  schedule:
    # 台灣時間每週一 05:00 (相當於 UTC 時間每週日 21:00)
    - cron: '0 21 * * 0'
  workflow_dispatch: # 支援在 GitHub 頁面上手動觸發執行

permissions:
  contents: write

jobs:
  update-fuel-prices:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 執行油價抓取腳本
        run: python3 scripts/fetch-fuel-prices.py

      - name: 自動提交與推送最新油價 JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fuel-prices.json
          if git diff --staged --quiet; then
            echo "油價數據無變更，跳過 Commit"
          else
            git commit -m "auto(fuel-prices): 自動更新本週中油與台塑最新油價 [skip ci]"
            git push
          fi
