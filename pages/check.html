<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, user-scalable=no, initial-scale=1, maximum-scale=1">
    <title>支票試算工具</title>

    <!-- 功能頁防護：被直接開啟時導回外殼，避免繞過安裝引導（必須放在最前面） -->
    <script src="../js/frame-guard.js"></script>

    <!-- Google Analytics 4 追蹤代碼 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XE5XMQR0Z1"></script>
    <script>
        const isInIframe = window !== window.parent;
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        
        const currentPageName = window.location.pathname.split('/').pop().replace('.html', '');
        // send_page_view: false 是關鍵。
        // 四個功能頁在開啟工具箱時會同時被載入（只是三個先藏起來），
        // 若每一頁都自己回報一次「有人瀏覽了頁面」，開一次工具箱就會產生
        // 五筆瀏覽紀錄（外殼一筆＋四頁各一筆），而且四頁的數字永遠一樣，
        // 完全看不出哪個功能真的有人用。瀏覽紀錄一律交給外殼統一送。
        gtag('config', 'G-XE5XMQR0Z1', {
            page_title: `貸款業務工具箱 - 支票計算`,
            page_location: window.location.href,
            page_path: window.location.pathname,
            send_page_view: false
        });
        
        function trackEvent(eventName, parameters = {}) {
            parameters.page_type = currentPageName;
            parameters.is_iframe = isInIframe;
            gtag('event', eventName, parameters);
        }
    </script>

    <!-- 引用全站通用樣式 -->
    <!-- 鍵盤與彈窗元件樣式（2026/07 從 calculator.css 抽出，需排在頁面樣式之前） -->
    <link rel="stylesheet" href="../css/keypad.css">
    <link rel="stylesheet" href="../css/calculator.css">

    <!-- 支票頁專用樣式（原本 290 行內嵌樣式已抽出，見 B2 修正說明） -->
    <link rel="stylesheet" href="../css/check.css">

    <!--
        數字鍵盤選項（必須在 common-modals.js 之前設定）
        支票頁的總金額／繳款金額／開票張數三個欄位都是整數，不需要小數點。
        舊版共用鍵盤上那顆小數點鍵會呼叫 calculatorDecimal()，
        但該函式只有計算頁有定義，在支票頁按下去會直接報錯且毫無反應。
    -->
    <script>
        window.KEYPAD_OPTIONS = { decimal: false };

        /* 逐欄位的鍵盤型別（2026/07 新增）
         *
         * KEYPAD_OPTIONS 是「整頁」共用一組按鍵，所以這三個欄位過去長得一模一樣：
         * 動輒三百萬的總金額要一位一位按七個 0，而開票張數（最多 99）
         * 卻也不需要加速鍵 —— 一組設定不可能同時滿足兩者。
         *
         * 金額型會多出 000 與 萬 兩顆鍵，顯示區也會即時顯示中文大寫，
         * 開支票時直接照抄，不必按了確認輸入才看到。
         *
         * maxDigits 與 check-engine.js 的 submitCalculatorValue() 一致
         * （總金額 9 位、繳款金額 7 位）。這裡是「按下去就擋」，
         * 那邊的語意驗證（不可為零等）仍然保留，兩層並存。
         *
         * 開票張數是計數型：末列只有 0 與 =（000 與 萬 只會讓人把
         * 12 張按成 12000 張），改成給常用張數快捷鍵。
         * 快捷值與計算頁的期數快捷鍵一致（12／24／36／48／60／72 期），
         * 因為含尾款票的總張數就等於貸款期數。
         *
         * sub 指向 check-engine.js 的 describeCheckCount()，
         * 與欄位下方那行拆解說明用同一支函式，兩邊不會分岔。
         *
         * 沒有列名的欄位一律沿用本頁預設，與改版前逐顆完全相同。 */
        window.KEYPAD_FIELDS = {
            'total-amount':   { form: 'amount', maxDigits: 9 },
            'payment-amount': { form: 'amount', maxDigits: 7 },
            'check-count':    {
                form: 'count',
                maxDigits: 2,
                chips: [12, 24, 36, 48, 60, 72],
                sub: 'describeCheckCount'
            }
        };
    </script>

    <!-- 引用通用組件與支票邏輯 JS
         注意：common-keypad.js 必須排在 check-engine.js 之前，
         它以 let 宣告鍵盤共用狀態，需先完成宣告 -->
    <script src="../js/common-keypad.js"></script>
    <script src="../js/common-modals.js"></script>
    <!-- 共用日期選擇器（2026/07：本頁原本自帶一套 <table> 月曆，已移除） -->
    <script src="../js/common-datepicker.js"></script>
    <script src="../js/common-footer.js"></script>
    <!-- 歷史紀錄共用儲存層，必須排在 check-engine.js 之前 -->
    <script src="../js/common-history.js"></script>
    <script src="../js/check-engine.js"></script>
</head>
<body>
    
    <!-- 1. 現在時間邊框與選單列留有 18px 間距，邊框完全露出 -->
    <div class="time-display-wrapper">
        <div id="timeDisplay" class="sticky-header">
            <div style="display: flex; justify-content: center; width: 100%;">
                <span class="time-label">現在時間</span>
                <span id="current-date"></span>
            </div>
        </div>
    </div>
    
    <div class="divider-flow"></div>
    
    <!-- 獨立欄位外框 -->
    <div class="row">
        <span class="label">總金額</span>
        <input type="text" id="total-amount" readonly onclick="openCalculator('total-amount', '總金額')">
    </div>
    
    <div class="amount-group">
        <div class="row amount-row">
            <span class="label">繳款金額</span>
            <input type="text" id="payment-amount" readonly onclick="openCalculator('payment-amount', '繳款金額')">
        </div>
        <div class="chinese-row">
            <div id="payment-amount-chinese" class="chinese-display full-width"></div>
        </div>
    </div>
    
    <!-- 開票張數是「含尾款票」的總張數。欄位名稱沒講清楚的話，
         業務若以為只要填月票張數就會少算一期，而且畫面上看不出異常 -->
    <div class="amount-group">
        <div class="row amount-row">
            <span class="label">開票張數</span>
            <input type="text" id="check-count" readonly onclick="openCalculator('check-count', '開票張數（含尾款票）')">
        </div>
        <div class="chinese-row">
            <div id="check-count-breakdown" class="count-breakdown"></div>
        </div>
    </div>

    <div class="amount-group">
        <div class="row amount-row">
            <span class="label">尾款金額</span>
            <input type="text" id="deposit-amount" class="readonly" readonly>
        </div>
        <div class="chinese-row">
            <div id="deposit-amount-chinese" class="chinese-display full-width"></div>
        </div>
    </div>

    <div class="row">
        <span class="label">開始日期</span>
        <input type="text" id="start-date" class="date-input" readonly onclick="showDatePicker()">
    </div>

    <div class="row">
        <span class="label">尾款票日期</span>
        <input type="text" id="end-date" class="date-input readonly" readonly>
    </div>
    
    <div class="divider-flow"></div>
    
    <!-- 開立進度：固定在畫面頂端，捲到第 40 列也還看得到。
         單行設計，只有偵測到中間漏開時才多出一行警示 -->
    <div id="write-progress" class="write-progress">
        <div class="write-progress-main">
            <div class="write-progress-done">已開 <b id="progress-done">0</b> <span class="muted">/ <span id="progress-total">0</span> 張</span></div>
            <div class="write-progress-left">還要開 <b id="progress-left">0</b> 張</div>
        </div>
        <div id="write-gap" class="write-gap" onclick="goToFirstUnwritten()">
            <span class="write-gap-text">中間有 <b id="gap-count">0</b> 張未打勾</span>
            <span class="write-gap-action">前往</span>
        </div>
    </div>

    <div class="check-list">
        <div class="check-list-title">開票日期列表</div>
        <div class="check-list-hint">開好一張就點一下該列打勾</div>
        <div id="check-list-content"></div>
    </div>

    <!-- 已開立金額合計：驗證有沒有漏開或漏打勾 -->
    <div id="write-summary" class="write-summary">
        <div>
            <div class="write-summary-label">已開立合計</div>
            <div class="write-summary-value"><span id="written-sum">0</span> / <span id="written-sum-total">0</span></div>
        </div>
        <div class="write-summary-note" id="written-sum-note"></div>
    </div>
    
    <!-- 4. 底部押票結算卡片 (醒目大字) -->
    <div class="deposit-info-card">
        <div class="deposit-amount-display" id="deposit-amount-display"></div>
        <div class="deposit-chinese-display" id="deposit-amount-display-chinese"></div>
        <div class="deposit-info-tip" id="deposit-amount-tip"></div>
    </div>
    
    <div class="divider-flow"></div>

    <!-- 換票那趟過去時：新的一批就是把尾款金額當總金額、尾款票日期當開始日期，
         月付金額不變，只有張數要重問客戶。一個按鈕帶完，不必重打四個欄位 -->
    <div class="function-buttons bottom-buttons" style="margin-top: 10px;">
        <div class="button-row">
            <button id="continue-btn" onclick="continueFromDeposit()" style="width: 100%;">以尾款續開下一批</button>
        </div>
    </div>

    <div class="divider-flow" style="margin: 6px 0;"></div>

    <!-- 提示放在「存檔」正上方 —— 那是要採取行動的地方。
         放進度列會跟開票進度搶注意力 -->
    <div id="unsaved-hint" class="unsaved-hint">已修改，尚未儲存</div>

    <!-- 5. 統一「清除全部輸入」按鈕樣式與計算頁面完全一致 -->
    <div class="function-buttons bottom-buttons">
        <div class="button-row">
            <button onclick="saveCheckData()">存檔</button>
            <button onclick="toggleHistoryPanel()">歷史</button>
        </div>
    </div>

    <div class="divider-flow" style="margin: 6px 0;"></div>

    <div class="function-buttons bottom-buttons">
        <div class="button-row">
            <button onclick="clearAllInputs()" style="width: 100%;">清除全部輸入</button>
        </div>
    </div>

    <!-- 日期選擇器
         2026/07：本頁原本自帶一套 <table> 版月曆（#date-picker-overlay），
         已改用四頁共用的日期選擇器（由 js/common-datepicker.js 注入）。
         共用版的面板高度固定、年月可直接點選、過去日期變色提醒而不禁選。 -->

    <!-- 歷史紀錄面板 -->
    <div id="historyPanel" class="history-panel">
        <div class="history-header">
            <div class="header-left">
                <h2>歷史紀錄</h2>
            </div>
            <div class="header-right">
                <button class="delete-all-btn" onclick="confirmDeleteAll()">清空歷史</button>
            </div>
            <button class="close-btn" onclick="toggleHistoryPanel()">×</button>
        </div>
        <div id="historyContent" class="history-content"></div>
    </div>

    <!-- 通用頁尾、提示模態框、確認模態框、數字輸入器模態框 由 common-modals.js 動態注入 -->

</body>
</html>
