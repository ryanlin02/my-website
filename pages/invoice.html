<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, user-scalable=no, initial-scale=1, maximum-scale=1">
    <title>發票金額轉換工具</title>

    <!-- Google Analytics 4 追蹤代碼 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XE5XMQR0Z1"></script>
    <script>
        const isInIframe = window !== window.parent;
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        
        const currentPageName = window.location.pathname.split('/').pop().replace('.html', '');
        gtag('config', 'G-XE5XMQR0Z1', {
            page_title: `貸款業務工具箱 - 發票計算`,
            page_location: window.location.href,
            page_path: window.location.pathname
        });
        
        function trackEvent(eventName, parameters = {}) {
            parameters.page_type = currentPageName;
            parameters.is_iframe = isInIframe;
            gtag('event', eventName, parameters);
        }
    </script>

    <!-- 引用全站通用樣式 -->
    <link rel="stylesheet" href="../css/calculator.css">

    <!-- 發票頁面原版 CSS 樣式 (100% 視覺與結構保留) -->
    <style>
    :root {
        --primary-color: #333333;
        --secondary-color: #4a4a4a;
        --text-color: #ffffff;
        --border-color: #555555;
        --hover-color: #666666;
        --shadow-color: rgba(0, 0, 0, 0.3);
        --button-orange: #ff9c33;
        --button-blue: #33b5e5;
    }
    
    html, body {
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        position: relative;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        padding: 0 3px !important;
        background-color: #333333;
        color: var(--text-color);
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        box-sizing: border-box;
    }
    
    .row {
        margin: 4px 0;
        display: flex;
        align-items: center;
        background: var(--secondary-color);
        padding: 3px;
        border-radius: 4px;
        box-shadow: 0 4px 8px var(--shadow-color);
        position: relative;
    }

    .label {
        width: 120px;
        margin-right: 15px;
        text-align: right;
        font-weight: 600;
        color: var(--text-color);
    }
    
    input {
        width: 100%;
        padding: 6px 8px;
        margin-bottom: 0;
        background-color: #222222;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
        box-sizing: border-box;
        touch-action: manipulation;
        height: 36px;
        text-align: right;
    }
    
    input:focus {
        outline: none;
        border-color: var(--button-orange);
        box-shadow: 0 0 0 3px rgba(255, 156, 51, 0.2);
    }
    
    .result {
        width: 100%;
        padding: 6px 8px;
        margin-bottom: 0;
        background-color: #222222;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 16px;
        position: relative;
        overflow: hidden;
        box-sizing: border-box;
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        text-align: right;
    }

    .result::after {
        content: attr(data-placeholder);
        opacity: 0.5;
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        color: #888888;
        font-size: 16px;
        white-space: nowrap;
        pointer-events: none;
    }

    .result:not(:empty)::after {
        display: none;
    }

    #financialResult {
        padding: 6px 8px;
        background-color: #222222;
        border: 2px solid var(--border-color);
        font-size: 21px;
        height: auto;
        min-height: 42px;
        max-height: 76px;
        overflow-y: auto;
        overflow-x: auto;
        white-space: normal;
        word-wrap: break-word;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        font-family: monospace;
        box-sizing: border-box;
        display: block;
        text-align: right;
        line-height: 1.2;
    }
    
    .container, .keyboard-container {
        background-color: var(--secondary-color);
        border-radius: 10px;
        padding: 10px;
        margin: 4px 0;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        position: relative;
        overflow: visible;
        width: 100%;
        box-sizing: border-box;
    }
    
    .keyboard-container {
        padding: 12px 10px;
    }

    .result-group-horizontal {
        display: flex;
        align-items: center;
        margin-bottom: 4px;
        width: 100%;
    }
    
    .result-group-horizontal label {
        width: 60px;
        margin-right: 0px;
        margin-bottom: 0;
        text-align: right;
        padding-right: 5px;
        font-weight: bold;
        color: var(--button-orange);
        flex-shrink: 0;
    }

    .result-group-horizontal label:empty {
        width: 0;
        padding-right: 0;
        margin-right: 0;
    }
    
    .calculator-keyboard {
        width: 100%;
        margin: 4px 0;
        touch-action: manipulation;
        padding: 0;
    }
    
    .keyboard-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
    }
    
    .calc-btn {
        flex: 1;
        margin: 0 5px;
        padding: 8px 5px;
        font-size: 24px;
        background-color: var(--secondary-color);
        color: var(--text-color);
        border: 2px solid var(--border-color);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        height: 50px;
        min-height: 45px;
        box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
    }

    .calc-btn.active {
        transform: scale(0.95) translateY(1px);
    }
    
    .result-group-horizontal input {
        flex: 1 !important;
        width: 100% !important;
        height: 36px !important;
        padding: 6px 8px !important;
        margin: 0 !important;
        background-color: #222222 !important;
        color: var(--text-color) !important;
        border: 1px solid var(--border-color) !important;
        border-radius: 8px !important;
        font-size: 16px !important;
        box-sizing: border-box !important;
        text-align: right !important;
    }
    
    .number-btn, .calc-number-btn {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        justify-content: center !important;
    }

    .number-btn:active, .calc-number-btn:active {
        background-color: var(--button-orange) !important;
        color: white !important;
    }

    .number-btn:active .arabic-number,
    .number-btn:active .financial-char,
    .calc-number-btn:active .arabic-number,
    .calc-number-btn:active .financial-char {
        color: white !important;
    }
    
    .arabic-number {
        font-size: 24px !important;
        margin-right: 8px !important;
    }
    
    .financial-char {
        font-size: 20px !important;
        color: var(--button-orange) !important;
    }
    
    .clear-btn, .backspace-btn {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
    }
    
    .clear-btn {
        background-color: var(--secondary-color);
        color: var(--button-blue);
        border: 1px solid var(--button-blue);
    }
    
    .clear-btn:active {
        background-color: var(--button-blue);
        color: white;
    }

    .clear-btn:hover {
        background-color: rgba(51, 181, 229, 0.2);
        border-color: var(--button-blue);
        color: white;
    }
    
    .divider-flow {
        position: relative;
        height: 2px;
        background: linear-gradient(90deg, 
            var(--secondary-color) 0%,
            var(--button-orange) 50%,
            var(--secondary-color) 100%);
        margin: 4px 0;
        overflow: hidden;
    }
    
    .divider-flow::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg,
            transparent,
            rgba(255, 156, 51, 0.8),
            transparent);
        animation: flowLight 3s ease-in-out infinite;
    }

    .time-display-wrapper {
        position: relative;
        height: auto;
        margin: 18px 0px 0px 0px;
        z-index: 1000;
    }

    .sticky-header {
        position: -webkit-sticky !important;
        position: sticky !important;
        top: 0;
        background: var(--secondary-color);
        padding: 8px;
        border-radius: 4px;
        box-shadow: 0 2px 4px var(--shadow-color);
        z-index: 999;
        width: calc(100% - 16px);
        margin: 0 auto;
    }

    .time-label {
        font-weight: bold;
        margin-right: 10px;
        color: var(--button-orange);
    }

    .action-buttons {
        display: flex;
        justify-content: space-between;
        margin: 4px 0;
        padding: 0;
        width: 100%;
        box-sizing: border-box;
    }

    .action-btn {
        flex: 1;
        margin: 0 2px;
        padding: 12px 0;
        background-color: var(--secondary-color);
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .action-btn:hover {
        background-color: var(--button-orange);
        border-color: var(--button-orange);
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .keyboard-switch-container {
        margin: 4px 0;
        width: 100%;
    }

    .keyboard-switch {
        display: flex;
        background-color: var(--secondary-color);
        border-radius: 10px;
        padding: 3px;
        border: 1px solid var(--border-color);
        width: 100%;
        box-sizing: border-box;
    }

    .switch-btn {
        flex: 1;
        padding: 8px 0;
        border: none;
        background: transparent;
        color: var(--text-color);
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
    }

    .switch-btn.active {
        background-color: var(--button-orange);
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(255, 156, 51, 0.4);
    }

    .operator-btn {
        font-weight: bold;
    }

    .special-operator {
        color: var(--button-orange);
    }

    .calc-equals {
        background-color: var(--button-orange);
        color: white;
    }

    .financial-digit {
        color: #FFBE7A;
        display: inline;
    }

    .limit-notification {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background-color: rgba(51, 51, 51, 0.95);
        color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        z-index: 9999;
        text-align: center;
        transition: transform 0.3s ease-out;
        border: 2px solid var(--button-orange);
        max-width: 80%;
    }

    .limit-notification.show {
        transform: translate(-50%, -50%) scale(1);
    }
    </style>

    <!-- 引用全站通用組件與發票邏輯 JS -->
    <script src="../js/common-modals.js"></script>
    <script src="../js/invoice-engine.js"></script>
</head>
<body>
    <div class="time-display-wrapper">
        <div id="timeDisplay" class="sticky-header">
            <div style="display: flex; justify-content: center; width: 100%;">
                <span class="time-label">現在時間</span>
                <span id="currentTime"></span>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="content-wrapper">
            <div class="result-group-horizontal">
                <label style="color: var(--button-orange); font-weight: bold;">總金額</label>
                <input type="tel" id="arabicNumber" placeholder="請輸入金額" oninput="updateResults()" inputmode="none" autocomplete="off" readonly>
            </div>
            
            <div class="result-group-horizontal">
                <label>未稅</label>
                <div class="result" id="preTaxAmount"></div>
            </div>
            
            <div class="result-group-horizontal">
                <label>稅金</label>
                <div class="result" id="taxAmount"></div>
            </div>
            
            <div class="result-group-horizontal">
                <label>中文</label>
                <div class="result" id="traditionalResult" data-placeholder="這裡會顯示轉換後的中文數字"></div>
            </div>
            
            <div class="result-group-horizontal">
                <label></label>
                <div class="result" id="financialResult" data-placeholder="這裡會顯示轉換後的國字大寫"></div>
            </div>
        </div>
    </div>
    
    <!-- 鍵盤切換按鈕列 -->
    <div class="keyboard-switch-container">
        <div class="keyboard-switch">
            <button id="direct-input-btn" class="switch-btn active">直接輸入</button>
            <button id="calculator-btn" class="switch-btn">計算機</button>
        </div>
    </div>

    <!-- 原始的數字鍵盤（直接輸入模式） -->
    <div id="direct-input-keyboard" class="keyboard-container">
        <div class="calculator-keyboard">
            <div class="keyboard-row">
                <button class="calc-btn number-btn" onclick="appendNumber(7)">
                    <div class="arabic-number">7</div>
                    <div class="financial-char">柒</div>
                </button>
                <button class="calc-btn number-btn" onclick="appendNumber(8)">
                    <div class="arabic-number">8</div>
                    <div class="financial-char">捌</div>
                </button>
                <button class="calc-btn number-btn" onclick="appendNumber(9)">
                    <div class="arabic-number">9</div>
                    <div class="financial-char">玖</div>
                </button>
            </div>
            <div class="keyboard-row">
                <button class="calc-btn number-btn" onclick="appendNumber(4)">
                    <div class="arabic-number">4</div>
                    <div class="financial-char">肆</div>
                </button>
                <button class="calc-btn number-btn" onclick="appendNumber(5)">
                    <div class="arabic-number">5</div>
                    <div class="financial-char">伍</div>
                </button>
                <button class="calc-btn number-btn" onclick="appendNumber(6)">
                    <div class="arabic-number">6</div>
                    <div class="financial-char">陸</div>
                </button>
            </div>
            <div class="keyboard-row">
                <button class="calc-btn number-btn" onclick="appendNumber(1)">
                    <div class="arabic-number">1</div>
                    <div class="financial-char">壹</div>
                </button>
                <button class="calc-btn number-btn" onclick="appendNumber(2)">
                    <div class="arabic-number">2</div>
                    <div class="financial-char">貳</div>
                </button>
                <button class="calc-btn number-btn" onclick="appendNumber(3)">
                    <div class="arabic-number">3</div>
                    <div class="financial-char">參</div>
                </button>
            </div>
            <div class="keyboard-row">
                <button class="calc-btn clear-btn" onclick="clearInput()">清除</button>
                <button class="calc-btn number-btn" onclick="appendNumber(0)">
                    <div class="arabic-number">0</div>
                    <div class="financial-char">零/拾</div>
                </button>
                <button class="calc-btn backspace-btn" onclick="backspace()">退回</button>
            </div>
        </div>
    </div>

    <!-- 計算機鍵盤（計算機模式） -->
    <div id="calculator-keyboard" class="keyboard-container" style="display: none;">
        <div class="calculator-display" style="background:#222; border:1px solid var(--border-color); border-radius:6px; padding:10px 15px; margin-bottom:15px; text-align:right; font-size:24px; color:#fff; height:36px; display:flex; align-items:center; justify-content:flex-end;">
            <div id="calculator-expression">0</div>
        </div>
        <div class="calculator-keyboard">
            <div class="keyboard-row">
                <button class="calc-btn operator-btn" onclick="calcClear()">C</button>
                <button class="calc-btn operator-btn special-operator" onclick="calcTaxAddition()" style="font-size: 20px;">稅外加</button>
                <button class="calc-btn operator-btn special-operator" onclick="calcClear()" style="font-size: 18px;">AC</button>
                <button class="calc-btn operator-btn special-operator" onclick="calcAddOperator('/')">/</button>
            </div>
            <div class="keyboard-row">
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber(7)">
                    <div class="arabic-number">7</div>
                    <div class="financial-char">柒</div>
                </button>
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber(8)">
                    <div class="arabic-number">8</div>
                    <div class="financial-char">捌</div>
                </button>
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber(9)">
                    <div class="arabic-number">9</div>
                    <div class="financial-char">玖</div>
                </button>
                <button class="calc-btn operator-btn special-operator" onclick="calcAddOperator('*')">×</button>
            </div>
            <div class="keyboard-row">
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber(4)">
                    <div class="arabic-number">4</div>
                    <div class="financial-char">肆</div>
                </button>
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber(5)">
                    <div class="arabic-number">5</div>
                    <div class="financial-char">伍</div>
                </button>
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber(6)">
                    <div class="arabic-number">6</div>
                    <div class="financial-char">陸</div>
                </button>
                <button class="calc-btn operator-btn special-operator" onclick="calcAddOperator('-')">－</button>
            </div>
            <div class="keyboard-row">
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber(1)">
                    <div class="arabic-number">1</div>
                    <div class="financial-char">壹</div>
                </button>
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber(2)">
                    <div class="arabic-number">2</div>
                    <div class="financial-char">貳</div>
                </button>
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber(3)">
                    <div class="arabic-number">3</div>
                    <div class="financial-char">參</div>
                </button>
                <button class="calc-btn operator-btn special-operator" onclick="calcAddOperator('+')">＋</button>
            </div>
            <div class="keyboard-row">
                <button class="calc-btn backspace-btn" onclick="calcBackspace()">退回</button>
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber(0)">
                    <div class="arabic-number">0</div>
                    <div class="financial-char">零</div>
                </button>
                <button class="calc-btn calc-number-btn" onclick="calcAddNumber('.')">.</button>
                <button class="calc-btn operator-btn calc-equals" onclick="calcEvaluate()">＝</button>
            </div>
        </div>
    </div>
    
    <div class="action-buttons">
        <button class="action-btn" id="saveInvoice" onclick="saveInvoiceData()">保存發票</button>
        <button class="action-btn" id="viewHistory" onclick="toggleHistoryPanel()">歷史記錄</button>
    </div>

    <!-- 歷史記錄面板 -->
    <div id="historyPanel" class="history-panel">
        <div class="history-header">
            <div class="header-left">
                <h2>發票歷史記錄</h2>
            </div>
            <div class="header-right">
                <button class="delete-all-btn" onclick="confirmDeleteAll()">全部刪除</button>
            </div>
            <button class="close-btn" onclick="toggleHistoryPanel()">×</button>
        </div>
        <div id="historyContent" class="history-content"></div>
    </div>

    <div class="divider-flow"></div>

    <!-- 通用頁尾、提示模態框、確認模態框 由 common-modals.js 動態注入 -->

</body>
</html>
