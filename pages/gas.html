<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>油資折讓試算工具</title>

    <!-- 功能頁防護：被直接開啟時導回外殼，避免繞過安裝引導（必須放在最前面） -->
    <script src="../js/frame-guard.js"></script>

    <!-- Google Analytics 4 追蹤代碼 -->
    <!-- ============================================================
         【2026/07 階段 3 大幅精簡：151 行 → 22 行】

         這個區塊原本比其他三頁多了 130 行，都是有害無益的追蹤：

         1. querySelectorAll('button') 無條件綁 click 追蹤
            加油頁有 39 顆按鈕，其中計算機佔 22 顆。
            業務算一筆要按十幾下，就送出十幾個 button_click 事件 ——
            GA4 報表被按鍵雜訊淹沒，看不出真正有意義的操作，
            還白耗業務在外面的行動網路流量。
            改為在 js/gas-engine.js 裡只追蹤四種有商業意義的操作。

         2. 滾動深度追蹤（未 throttle 的 scroll 監聽）
            每一次滾動事件都讀 document.body.scrollHeight，
            那會強制瀏覽器重新計算版面（reflow），是明確的卡頓來源。

         3. 長按偵測
            每次 touchstart 都開一個 500ms timer，但加油頁沒有任何長按功能。

         4. beforeunload
            index.html 是用 display:none 切換 iframe、頁面根本不會卸載，
            這個事件的觸發時機不可靠，收到的數據沒有意義。

         5. form_submit 與 iframe_loaded
            加油頁沒有任何 <form>；iframe_loaded 也沒有任何監聽者
            （index.html 的 message 監聽只處理隱私權與服務條款頁的關閉請求）。

         現在這個區塊與 check.html、invoice.html 完全同構。
         ============================================================ -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XE5XMQR0Z1"></script>
    <script>
        const isInIframe = window !== window.parent;
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        const currentPageName = window.location.pathname.split('/').pop().replace('.html', '');
        // send_page_view: false 的原因見 check.html 同一段的說明：
        // 避免四個功能頁各自回報一次瀏覽，把數字灌成五倍。
        gtag('config', 'G-XE5XMQR0Z1', {
            page_title: `貸款業務工具箱 - 加油計算`,
            page_location: window.location.href,
            page_path: window.location.pathname,
            send_page_view: false
        });

        function trackEvent(eventName, parameters = {}) {
            parameters.page_type = currentPageName;
            parameters.is_iframe = isInIframe;
            gtag('event', eventName, parameters);
        }
    </script>

    <!-- 鍵盤與彈窗元件樣式（三頁共用，必須排在頁面樣式之前讓頁面可覆寫） -->
    <link rel="stylesheet" href="../css/keypad.css">

    <!-- 加油頁專用樣式（原內嵌於本檔，2026/07 階段 2 拆出） -->
    <link rel="stylesheet" href="../css/gas.css">
</head>
<body>

    <!-- 時間顯示區塊 - 調整為與輸入欄位相同寬度 -->
    <div class="time-display-wrapper">
        <div id="timeDisplay" class="sticky-header">
            <span class="time-label">現在時間</span>
            <span id="current-date"></span>
        </div>
    </div>

    <!-- 時間與油品單價之間的流光分隔線 -->
    <div class="divider-flow"></div>

    <div class="container">
        <!-- 油品單價輸入欄位 -->
        <div class="input-row">
            <label class="input-label">油品單價</label>
            <div class="diesel-price-wrapper">  <!-- 修改：使用專用容器類別 -->
                <input type="text" 
                    id="dieselPrice" 
                    class="input-field" 
                    placeholder="0.0"
                    readonly>
                <!-- 快速價格選擇按鈕容器 -->
                <div class="price-buttons-container">
                    <button class="quick-price-btn" id="btnCpcDiesel" onclick="setDieselPrice(28.8)" title="中油價格">中</button>
                    <button class="quick-price-btn" id="btnFormosaDiesel" onclick="setDieselPrice(28.6)" title="台塑價格">塑</button>
                </div>
            </div>
        </div>
        
        <!-- 每月油錢輸入欄位 -->
        <!-- 每月油錢輸入欄位（加入快速按鈕組） -->
        <div class="input-button-group">
            <!-- 原有的輸入欄位 -->
            <div class="input-row">
                <label class="input-label">每月油錢</label>
                <div class="input-wrapper">
                    <input type="text" 
                        id="monthlyExpense" 
                        class="input-field" 
                        placeholder="0"
                        readonly>
                    <span class="input-unit">元</span>
                </div>
            </div>
            
            <!-- 新增：快速調整按鈕組 -->
            <!-- 快速調整按鈕組 - 與貸款試算工具的本金調整按鈕一致 -->
            <div id="monthlyExpenseButtons" class="quick-adjust-buttons">
                <button onclick="adjustMonthlyExpense(-1000000)">-100</button>
                <button onclick="adjustMonthlyExpense(-100000)">-10</button>
                <button onclick="adjustMonthlyExpense(-10000)">-1</button>
                <button onclick="adjustMonthlyExpense(10000)">+1</button>
                <button onclick="adjustMonthlyExpense(100000)">+10</button>
                <button onclick="adjustMonthlyExpense(1000000)">+100</button>
            </div>
        </div>
        
        <!-- 每月油量輸入欄位 -->
        <div class="input-row">
            <label class="input-label">每月油量</label>
            <div class="input-wrapper">
                <input type="text" 
                       id="monthlyVolume" 
                       class="input-field" 
                       placeholder="0"
                       readonly>
                <span class="input-unit">公升</span>
            </div>
        </div>
        
        <!-- 折扣金額輸入欄位 -->
        <!-- 折扣金額輸入欄位（加入快速按鍵組） -->
        <div class="input-button-group">
            <!-- 原有的輸入欄位 -->
            <div class="input-row">
                <label class="input-label">折扣金額</label>
                <div class="input-wrapper">
                    <input type="text" 
                        id="discountAmount" 
                        class="input-field" 
                        placeholder="0.0"
                        readonly>
                    <span class="input-unit">元/公升</span>
                </div>
            </div>
            
            <!-- 新增：快速調整按鍵組 -->
            <div id="discountAmountButtons" class="quick-adjust-buttons">
                <button onclick="adjustDiscountAmount(-0.1)">-1</button>
                <button onclick="setDiscountAmount(0.4)">4</button>
                <button onclick="setDiscountAmount(0.5)">5</button>
                <button onclick="setDiscountAmount(0.6)">6</button>
                <button onclick="setDiscountAmount(0.7)">7</button>
                <button onclick="setDiscountAmount(0.8)">8</button>
                <button onclick="setDiscountAmount(0.9)">9</button>
                <button onclick="adjustDiscountAmount(0.1)">+1</button>
            </div>
        </div>

        <!-- 動畫分隔線 - 分隔輸入區與結果區 -->
        <div class="divider-flow"></div>
        
        <!-- 折後油錢顯示欄位 -->
        <div class="input-row">
            <label class="input-label">折後油錢</label>
            <div class="input-wrapper">
                <input type="text" 
                       id="discountedExpense" 
                       class="input-field" 
                       placeholder="0"
                       disabled>
                <span class="input-unit">元</span>
            </div>
        </div>
        
        <!-- 每月節省顯示欄位 -->
        <div class="input-row">
            <label class="input-label">每月節省</label>
            <div class="input-wrapper">
                <input type="text" 
                       id="monthlySaving" 
                       class="input-field" 
                       placeholder="0"
                       disabled>
                <span class="input-unit">元</span>
            </div>
        </div>
        
        <!-- 每年節省顯示欄位 -->
        <div class="input-row">
            <label class="input-label">每年節省</label>
            <div class="input-wrapper">
                <input type="text" 
                       id="yearlySaving" 
                       class="input-field" 
                       placeholder="0"
                       disabled>
                <span class="input-unit">元</span>
            </div>
        </div>

        <!-- 動畫分隔線 - 分隔結果區與功能按鈕 -->
        <div class="divider-flow"></div>
        
        <!-- 清除按鈕 -->
        <button class="clear-button" onclick="clearCalculation()">清除</button>
    </div>

    <!-- 本週油價對照表區塊
         【2026/07 階段 5 版面壓縮】
         原本上方有一列標題「本週油品單價對照表」＋「點擊油品單價計算」提示標籤，
         連同分隔線與間距共佔 40px。兩者都已移除：
           - 標題：業務每天用，不需要被告知這張表是什麼
           - 提示：改由價格本身做成色塊（見 .price-val 樣式），
                   一看就知道可以點，比用文字說明更直接
         表頭三欄與油品全名、更新時間註記都刻意保留 —— 它們都是單行，
         不影響高度，但少了會看不出哪一欄是哪家油商。 -->
        <div class="price-checker-container">
            <div class="fuel-price-table-wrapper">
                <table class="fuel-price-table">
                    <thead>
                        <tr>
                            <th style="text-align: left; padding-left: 12px;">油品種類</th>
                            <th>台灣中油</th>
                            <th>台塑石油</th>
                        </tr>
                    </thead>
                    <tbody id="fuelPriceTableBody">
                        <!-- 由 JavaScript 動態繪製 -->
                    </tbody>
                </table>
            </div>
            <div class="table-footnote" id="tableFootnote">* 最後更新時間：載入中...</div>
        </div>

    <!-- 底部留白與版本號由 js/common-footer.js 注入的頁尾負責。
         原本這裡有一個空的 .bottom-buffer-container 只為了撐出底部空間，
         頁尾本身的下方留白已足夠，那個空 div 已移除。 -->

    <!-- 鍵盤與彈窗的 DOM 由 js/common-modals.js 動態注入，本檔不需要寫。
         原本這裡有 43 行自有計算機 HTML，2026/07 階段 4 改用共用鍵盤後移除。 -->

    <!-- 共用鍵盤選項（頁面層級的預設值，必須在載入 common-modals.js 之前設定）
         本頁四個欄位現在都各自宣告了型別（見下方 KEYPAD_FIELDS），
         這一行只剩兩個作用：注入鍵盤時的初始樣子，以及日後新增欄位卻
         忘了宣告型別時的退路。 -->
    <script>
        window.KEYPAD_OPTIONS = { accelerators: ['00'] };

        /* 逐欄位的鍵盤型別（2026/07 新增）
         *
         * 每月油量是計數型（整數公升，submitCalculatorValue() 會 Math.round），
         * 所以收掉小數點；但它動輒四五位數，00 留著比較好按，
         * 用欄位層級的 accelerators 覆寫計數型的預設。
         *
         * 沒有給快捷值：每月油量沒有一組公認的常用數字，
         * 硬給幾個反而會誤導。快捷列沒有內容時不佔任何高度。
         *
         * 油品單價與折扣金額是小數型：保留小數點、收掉 00
         * （29.3 後面按 00 得到 29.300，沒有任何意義），
         * 小數位數比照兩者存檔時的 toFixed(1) —— 打得出 29.37 卻被無聲
         * 存成 29.4，是最容易讓人以為「這個工具會亂跳」的情況。
         *
         * 折扣金額的快捷值與畫面上那排 4～9 角的按鈕完全相同，不另立一套；
         * 油品單價沒有固定的常用值（每週油價都不同，畫面上已有中／塑兩顆鍵），
         * 所以不給快捷值。
         *
         * 兩者的副資訊都顯示折後單價 —— 那是這頁真正要看的數字。 */
        window.KEYPAD_FIELDS = {
            /* 每月油錢是金額型：把頁面層級的 00 換成 000 與 萬（動輒數十萬），
             * 副資訊顯示「幾萬」，多一個零少一個零一眼就看得出來。 */
            monthlyExpense: { form: 'amount', maxDigits: 8, sub: 'magnitude' },

            monthlyVolume:  { form: 'count', maxDigits: 6, accelerators: ['00'] },
            dieselPrice:    {
                form: 'decimal', maxDigits: 3, maxDecimals: 1,
                sub: 'describeFuelPrice'
            },
            discountAmount: {
                form: 'decimal', maxDigits: 1, maxDecimals: 1,
                chips: [0.4, 0.5, 0.6, 0.7, 0.8, 0.9],
                sub: 'describeDiscount'
            }
        };
    </script>

    <!-- 共用鍵盤：common-keypad.js 必須排在 common-modals.js 之前，
         它以 let 宣告鍵盤共用狀態，需先完成宣告 -->
    <script src="../js/common-keypad.js"></script>
    <script src="../js/common-modals.js"></script>

    <!-- 加油頁試算引擎（原內嵌於本檔，2026/07 階段 2 拆出） -->
    <script src="../js/gas-engine.js"></script>
    <script src="../js/common-footer.js"></script>
</body>
</html>
